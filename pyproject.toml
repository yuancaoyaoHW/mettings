[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mettings"
version = "0.1.0"
description = "智能会议纪要 LLM Agent 模块"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "langchain>=0.1",
    "langchain-openai>=0.0.5",
    "pymilvus>=2.3",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_minutes*", "config*", "data*", "services*", "pipelines*", "api*"]
